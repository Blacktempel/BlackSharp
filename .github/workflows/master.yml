name: Build master

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      upload_build_artifacts:
        description: Upload NuGet packages and compiled libraries
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      upload_build_artifacts:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:

  build:

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    env:
      Solution_Name: BlackSharp.sln
      TEST_FRAMEWORKS: net8.0 net9.0 net10.0 net11.0

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup MSBuild on Windows
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
      with:
        msbuild-architecture: x64

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 11.0.x
        check-latest: false
        skip-lts-prepass: true

    - name: Install missing .NET test runtimes
      shell: bash
      run: |
        set -euo pipefail
        runtimes=$(dotnet --list-runtimes)
        extension=sh
        if [[ "$RUNNER_OS" == 'Windows' ]]; then extension=ps1; fi
        installer="$RUNNER_TEMP/dotnet-install-test-runtime.$extension"

        # Install the runtime for each test target that the active dotnet host cannot find.
        for framework in $TEST_FRAMEWORKS; do
          channel=${framework#net}
          pattern="^Microsoft\.NETCore\.App ${channel%.*}\.${channel#*.}\.[0-9]+ "
          if grep -Eq "$pattern" <<< "$runtimes"; then
            continue
          fi
          if [[ ! -f "$installer" ]]; then
            curl -fsSL --retry 3 "https://raw.githubusercontent.com/dotnet/install-scripts/da3ce11ba63f3dbb0fb835d41bda2665d5c48e84/src/dotnet-install.$extension" -o "$installer"
          fi
          if [[ "$extension" == 'ps1' ]]; then
            pwsh -NoProfile -NonInteractive -File "$installer" -Runtime dotnet -Channel "$channel" -InstallDir "$DOTNET_ROOT" -NoPath -SkipNonVersionedFiles
          else
            bash "$installer" --runtime dotnet --channel "$channel" --install-dir "$DOTNET_ROOT" --no-path --skip-non-versioned-files
          fi
          runtimes=$(dotnet --list-runtimes)
          if ! grep -Eq "$pattern" <<< "$runtimes"; then
            echo "::error::The active dotnet host cannot find the .NET $channel runtime."
            exit 1
          fi
        done

    - name: Cache NuGet packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-${{ runner.arch }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '**/nuget.config', '**/NuGet.config', '**/NuGet.Config', '**/global.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-nuget-

    - name: Validate shared version
      id: version
      shell: pwsh
      run: |
        dotnet msbuild BlackSharp.Core/BlackSharp.Core.csproj -nologo -t:ValidateBlackSharpVersion
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        $version = (Get-Content -LiteralPath Versions/BLACKSHARP.VERSION -Raw).Trim()
        "version=$version" >> $env:GITHUB_OUTPUT

    - name: NuGet restore Windows
      if: runner.os == 'Windows'
      run: nuget restore $env:Solution_Name

    - name: Dotnet restore Linux
      if: runner.os == 'Linux'
      run: dotnet restore

    - name: Build Windows Release
      if: runner.os == 'Windows'
      run: msbuild $env:Solution_Name /p:Configuration=Release /p:Platform="Any CPU" -m

    - name: Build Linux Release
      if: runner.os == 'Linux'
      run: dotnet build --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test --configuration Release --no-build --no-restore -- RunConfiguration.TreatNoTestsAsError=true

    - name: Pack NuGet packages
      if: runner.os == 'Windows'
      shell: pwsh
      run: dotnet pack $env:Solution_Name --configuration Release --no-build --no-restore --output "$env:RUNNER_TEMP/BlackSharp-NuGet"

    - name: Verify NuGet package versions
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        BLACKSHARP_VERSION: ${{ steps.version.outputs.version }}
      run: |
        $ErrorActionPreference = 'Stop'

        $expectedPackages = @(
          'BlackSharp.Core'
          'BlackSharp.IO.HID'
          'BlackSharp.IO.Ports'
          'BlackSharp.MVVM'
          'BlackSharp.Platform.Startup'
          'BlackSharp.UI.Avalonia'
        )
        $packages = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/BlackSharp-NuGet" -Filter '*.nupkg' -File | Sort-Object Name)
        if ($packages.Count -ne $expectedPackages.Count) {
          throw "Expected $($expectedPackages.Count) NuGet packages, found $($packages.Count)."
        }

        foreach ($package in $packages) {
          $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $specifications = @($archive.Entries | Where-Object { $_.FullName.EndsWith('.nuspec') })
            if ($specifications.Count -ne 1) {
              throw "Expected one NuGet specification in $($package.Name)."
            }

            $reader = [System.IO.StreamReader]::new($specifications[0].Open())
            try {
              [xml]$specification = $reader.ReadToEnd()
            }
            finally {
              $reader.Dispose()
            }

            $packageID = [string]$specification.package.metadata.id
            $packageVersion = [string]$specification.package.metadata.version
            if ($packageID -cnotin $expectedPackages) {
              throw "Unexpected or duplicate NuGet package: $packageID."
            }
            if ($packageVersion -cne $env:BLACKSHARP_VERSION) {
              throw "Package $packageID has version $packageVersion instead of $env:BLACKSHARP_VERSION."
            }

            $expectedPackages = @($expectedPackages | Where-Object { $_ -cne $packageID })
          }
          finally {
            $archive.Dispose()
          }
        }

        Write-Host "Verified $($packages.Count) BlackSharp NuGet packages at version $env:BLACKSHARP_VERSION."

    - name: Upload NuGet packages
      if: ${{ runner.os == 'Windows' && github.event_name != 'push' && github.event_name != 'pull_request' && inputs.upload_build_artifacts }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: BlackSharp-NuGet-${{ steps.version.outputs.version }}
        path: ${{ runner.temp }}/BlackSharp-NuGet/*.nupkg
        if-no-files-found: error

    - name: Upload compiled libraries
      if: ${{ runner.os == 'Windows' && github.event_name != 'push' && github.event_name != 'pull_request' && inputs.upload_build_artifacts }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: BlackSharp-Libraries-${{ steps.version.outputs.version }}
        path: |
          BlackSharp.*/bin/Release/net472/
          BlackSharp.*/bin/Release/net481/
          BlackSharp.*/bin/Release/netstandard2.0/
          BlackSharp.*/bin/Release/net8.0/
          BlackSharp.*/bin/Release/net9.0/
          BlackSharp.*/bin/Release/net10.0/
          BlackSharp.*/bin/Release/net11.0/
        if-no-files-found: error
