name: Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: Optional release title (defaults to the tag)
        required: false
        default: ''
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: false
        default: false
        type: boolean
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  validate_release_inputs:
    name: Validate release inputs
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Read shared version and validate release tag
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet msbuild BlackSharp.Core/BlackSharp.Core.csproj -nologo -t:ValidateBlackSharpVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $version = (Get-Content -LiteralPath Versions/BLACKSHARP.VERSION -Raw).Trim()
          $tagName = "v$version"

          git check-ref-format "refs/tags/$tagName"
          if ($LASTEXITCODE -ne 0) {
            throw "The generated Git tag is invalid: $tagName"
          }

          $remoteTag = @(git ls-remote --tags origin "refs/tags/$tagName")
          if ($LASTEXITCODE -ne 0) {
            throw 'The existing Git tags could not be checked.'
          }
          if ($remoteTag.Count -gt 0) {
            throw "The Git tag already exists: $tagName"
          }

          $releaseTags = @(gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) {
            throw 'The existing releases and drafts could not be checked.'
          }
          if ($tagName -cin $releaseTags) {
            throw "A release or draft already exists for $tagName."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag_name=$tagName" >> $env:GITHUB_OUTPUT

  build_packages:
    name: Build and test release packages
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate_release_inputs
    uses: ./.github/workflows/master.yml
    permissions:
      contents: read
    with:
      upload_build_artifacts: true

  create_draft_release:
    name: Create draft GitHub release
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs:
      - validate_release_inputs
      - build_packages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: BlackSharp-NuGet-${{ needs.validate_release_inputs.outputs.version }}
          path: staging/NuGet

      - name: Download Windows libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: BlackSharp-Windows-${{ needs.validate_release_inputs.outputs.version }}
          path: staging/Windows

      - name: Download Linux libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: BlackSharp-Linux-${{ needs.validate_release_inputs.outputs.version }}
          path: staging/Linux

      - name: Validate and archive release assets
        shell: pwsh
        env:
          BLACKSHARP_VERSION: ${{ needs.validate_release_inputs.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $expectedPackages = @(
            'BlackSharp.Core'
            'BlackSharp.IO.HID'
            'BlackSharp.IO.Ports'
            'BlackSharp.MVVM'
            'BlackSharp.UI.Avalonia'
          )
          $packages = @(Get-ChildItem -LiteralPath 'staging/NuGet' -Filter '*.nupkg' -File | Sort-Object Name)
          if ($packages.Count -ne $expectedPackages.Count) {
            throw "Expected $($expectedPackages.Count) NuGet packages, found $($packages.Count)."
          }

          foreach ($package in $packages) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
            try {
              $specifications = @($archive.Entries | Where-Object { $_.FullName.EndsWith('.nuspec') })
              if ($specifications.Count -ne 1) {
                throw "Expected one NuGet specification in $($package.Name)."
              }

              $reader = [System.IO.StreamReader]::new($specifications[0].Open())
              try {
                [xml]$specification = $reader.ReadToEnd()
              }
              finally {
                $reader.Dispose()
              }

              $packageID = [string]$specification.package.metadata.id
              $packageVersion = [string]$specification.package.metadata.version
              if ($packageID -cnotin $expectedPackages) {
                throw "Unexpected or duplicate NuGet package: $packageID."
              }
              if ($packageVersion -cne $env:BLACKSHARP_VERSION) {
                throw "Package $packageID has version $packageVersion instead of $env:BLACKSHARP_VERSION."
              }

              $expectedPackages = @($expectedPackages | Where-Object { $_ -cne $packageID })
            }
            finally {
              $archive.Dispose()
            }
          }

          Write-Host "Verified $($packages.Count) BlackSharp NuGet packages at version $env:BLACKSHARP_VERSION."

          $releaseDirectory = (New-Item -ItemType Directory -Path release-assets -Force).FullName

          foreach ($component in @('NuGet', 'Windows', 'Linux')) {
            $source = (Resolve-Path -LiteralPath "staging/$component").Path
            $destination = Join-Path $releaseDirectory "BlackSharp-$component-$env:BLACKSHARP_VERSION.zip"
            [System.IO.Compression.ZipFile]::CreateFromDirectory(
              $source,
              $destination,
              [System.IO.Compression.CompressionLevel]::Optimal,
              $true)
          }

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate_release_inputs.outputs.tag_name }}
          RELEASE_NAME: ${{ inputs.release_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $title = $env:RELEASE_NAME
          if ([string]::IsNullOrWhiteSpace($title)) {
            $title = $env:RELEASE_TAG
          }

          $arguments = @(
            'release', 'create', $env:RELEASE_TAG,
            '--target', $env:GITHUB_SHA,
            '--title', $title,
            '--draft',
            '--generate-notes'
          )
          if ($env:PRERELEASE -eq 'true') {
            $arguments += '--prerelease'
          }
          $arguments += @(Get-ChildItem -LiteralPath release-assets -Filter '*.zip' -File | Sort-Object Name | ForEach-Object { $_.FullName })

          $releaseUrl = gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw 'The draft release could not be created.'
          }

          @(
            '### Draft release created'
            ''
            "[$env:RELEASE_TAG]($releaseUrl) is ready for review."
            'The archived NuGet packages will be published only after this draft is published.'
          ) >> $env:GITHUB_STEP_SUMMARY

  publish_nuget:
    name: Publish NuGet packages
    if: ${{ github.event_name == 'release' && github.event.action == 'published' && !github.event.release.draft }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Validate released version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          dotnet msbuild BlackSharp.Core/BlackSharp.Core.csproj -nologo -t:ValidateBlackSharpVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $version = (Get-Content -LiteralPath Versions/BLACKSHARP.VERSION -Raw).Trim()
          if ($env:RELEASE_TAG -cne "v$version") {
            throw "Release tag '$env:RELEASE_TAG' does not match the shared version '$version'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download and extract release NuGet packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BLACKSHARP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $archiveName = "BlackSharp-NuGet-$env:BLACKSHARP_VERSION.zip"

          gh release download $env:RELEASE_TAG --pattern $archiveName --dir dist
          if ($LASTEXITCODE -ne 0) {
            throw 'The release NuGet archive could not be downloaded.'
          }

          Expand-Archive -LiteralPath "dist/$archiveName" -DestinationPath dist/packages

      - name: Verify and publish NuGet packages
        shell: pwsh
        env:
          BLACKSHARP_VERSION: ${{ steps.version.outputs.version }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          NUGET_SOURCE: ${{ vars.NUGET_SOURCE || 'https://api.nuget.org/v3/index.json' }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'The NUGET_API_KEY repository secret is not configured.'
          }

          $ErrorActionPreference = 'Stop'

          $expectedPackages = @(
            'BlackSharp.Core'
            'BlackSharp.IO.HID'
            'BlackSharp.IO.Ports'
            'BlackSharp.MVVM'
            'BlackSharp.UI.Avalonia'
          )
          $packages = @(Get-ChildItem -LiteralPath 'dist/packages/NuGet' -Filter '*.nupkg' -File | Sort-Object Name)
          if ($packages.Count -ne $expectedPackages.Count) {
            throw "Expected $($expectedPackages.Count) NuGet packages, found $($packages.Count)."
          }

          foreach ($package in $packages) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
            try {
              $specifications = @($archive.Entries | Where-Object { $_.FullName.EndsWith('.nuspec') })
              if ($specifications.Count -ne 1) {
                throw "Expected one NuGet specification in $($package.Name)."
              }

              $reader = [System.IO.StreamReader]::new($specifications[0].Open())
              try {
                [xml]$specification = $reader.ReadToEnd()
              }
              finally {
                $reader.Dispose()
              }

              $packageID = [string]$specification.package.metadata.id
              $packageVersion = [string]$specification.package.metadata.version
              if ($packageID -cnotin $expectedPackages) {
                throw "Unexpected or duplicate NuGet package: $packageID."
              }
              if ($packageVersion -cne $env:BLACKSHARP_VERSION) {
                throw "Package $packageID has version $packageVersion instead of $env:BLACKSHARP_VERSION."
              }

              $expectedPackages = @($expectedPackages | Where-Object { $_ -cne $packageID })
            }
            finally {
              $archive.Dispose()
            }
          }

          Write-Host "Verified $($packages.Count) BlackSharp NuGet packages at version $env:BLACKSHARP_VERSION."

          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --api-key $env:NUGET_API_KEY `
              --source $env:NUGET_SOURCE `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              throw "NuGet publication failed for $($package.Name)."
            }
          }
